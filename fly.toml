# Optional Fly.io config. Create the app first (`fly apps create`), then
# `fly deploy` from this branch. See docs/deploy.md.

app = "world-audio-repository"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.http_options]
    [http_service.http_options.response]
      pristine = true

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "2m"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
